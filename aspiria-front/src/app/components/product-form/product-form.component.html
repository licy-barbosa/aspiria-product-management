<div class="glass-panel mx-0 mx-md-auto p-4 p-md-5 rounded-0 rounded-md-4 shadow-sm" style="max-width: 600px;">
  <div class="d-flex align-items-center mb-4 pb-3 border-bottom border-light">
    <div class="bg-primary bg-opacity-10 text-primary rounded-circle p-3 me-3 d-flex align-items-center justify-content-center" style="width: 48px; height: 48px;">
      <i class="bi" [ngClass]="isEdit ? 'bi-pencil-fill' : 'bi-plus-lg'" style="font-size: 1.25rem;"></i>
    </div>
    <h3 class="mb-0 fw-bold">{{ isEdit ? 'Edit Product' : 'Add New Product' }}</h3>
  </div>

  <form (ngSubmit)="save()" #productForm="ngForm" class="mt-4">
    
    <div class="row mb-4">
      <div class="col-md-6 mb-4 mb-md-0">
        <label for="name" class="form-label fw-semibold text-secondary mb-2 small text-uppercase tracking-wide">Product Name</label>
        <div class="input-group">
          <span class="input-group-text bg-transparent border-end-0 border-light text-muted">
            <i class="bi bi-tag"></i>
          </span>
          <input type="text" class="form-control modern-form-control border-start-0 ps-0" id="name" name="name" [(ngModel)]="product.name" placeholder="e.g. Barbie Developer" required>
        </div>
      </div>
      <div class="col-md-6">
        <label for="price" class="form-label fw-semibold text-secondary mb-2 small text-uppercase tracking-wide">Price</label>
        <div class="input-group">
          <span class="input-group-text bg-transparent border-end-0 border-light text-muted">
            <i class="bi bi-currency-dollar"></i>
          </span>
          <input type="number" class="form-control modern-form-control border-start-0 ps-0" id="price" name="price" [(ngModel)]="product.price" placeholder="0.00" required>
        </div>
      </div>
    </div>
    
    <div class="row mb-4">
      <div class="col-md-8 mb-4 mb-md-0">
        <label for="company" class="form-label fw-semibold text-secondary mb-2 small text-uppercase tracking-wide">Company</label>
        <div class="input-group">
          <span class="input-group-text bg-transparent border-end-0 border-light text-muted">
            <i class="bi bi-building"></i>
          </span>
          <input type="text" class="form-control modern-form-control border-start-0 ps-0" id="company" name="company" [(ngModel)]="product.company" placeholder="e.g. Mattel">
        </div>
      </div>
      <div class="col-md-4">
        <label for="age" class="form-label fw-semibold text-secondary mb-2 small text-uppercase tracking-wide">Max Age</label>
        <div class="input-group">
          <span class="input-group-text bg-transparent border-end-0 border-light text-muted">
            <i class="bi bi-person"></i>
          </span>
          <input type="number" class="form-control modern-form-control border-start-0 ps-0" id="age" name="age" [(ngModel)]="product.ageRestriction" placeholder="12">
        </div>
      </div>
    </div>
    
    <div class="mb-5">
      <label for="description" class="form-label fw-semibold text-secondary mb-2 small text-uppercase tracking-wide">Description</label>
      <textarea class="form-control modern-form-control border-light" id="description" name="description" rows="4" [(ngModel)]="product.description" placeholder="Enter product description here..."></textarea>
    </div>
    
    <div class="d-flex justify-content-end gap-3 pt-3 border-top border-light">
      <button type="button" class="btn btn-action px-4 py-2" (click)="cancel()">
        <i class="bi bi-x-lg me-1"></i> Cancel
      </button>
      <button type="submit" class="btn btn-gradient px-5 py-2" [disabled]="!productForm.form.valid">
        <i class="bi bi-check-lg me-1"></i> Save Changes
      </button>
    </div>

  </form>
</div>
