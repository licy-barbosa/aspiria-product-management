<div class="glass-panel mx-0 mx-md-auto p-3 p-md-4 rounded-0 rounded-md-4 shadow-sm">
  <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
    <h2 class="mb-0 fw-bold d-flex align-items-center">
      <i class="bi bi-list-ul me-2 text-primary"></i> Lista de Productos
    </h2>
    <button class="btn btn-gradient px-4 py-2" (click)="addNew()">
      <i class="bi bi-plus-lg me-1"></i> Nuevo Producto
    </button>
  </div>

  <div class="table-responsive modern-table border-0 shadow-sm rounded-3">
    <table class="table table-borderless table-hover align-middle mb-0">
      <thead>
        <tr>
          <th scope="col" class="ps-4">Id</th>
          <th scope="col">Name</th>
          <th scope="col">Age</th>
          <th scope="col">Price</th>
          <th scope="col">Company</th>
          <th scope="col" class="text-end pe-4">Actions</th>
        </tr>
      </thead>
      <tbody>
        @for (p of products(); track p.id) {
          <tr>
            <td class="ps-4 fw-medium text-secondary">#{{ p.id }}</td>
            <td class="fw-semibold">{{ p.name }}</td>
            <td>
              <span class="badge bg-light text-dark border"><i class="bi bi-person me-1"></i>{{ p.ageRestriction || 'N/A' }}</span>
            </td>
            <td class="fw-bold text-success">${{ p.price | number:'1.2-2' }}</td>
            <td>
              <span class="d-inline-flex align-items-center">
                <i class="bi bi-building me-2 text-muted"></i>{{ p.company }}
              </span>
            </td>
            <td class="text-end pe-4">
              <button (click)="updateProduct(p.id!)" class="btn-action edit me-2" aria-label="Edit">
                <i class="bi bi-pencil-square"></i>
              </button>
              <button (click)="deleteProduct(p.id!)" class="btn-action delete" aria-label="Delete">
                <i class="bi bi-trash3"></i>
              </button>
            </td>
          </tr>
        }
        @if (products().length === 0) {
          <tr>
            <td colspan="6" class="text-center py-5 text-muted">
              <i class="bi bi-inbox fs-1 d-block mb-3"></i>
              <p class="fs-5 mb-0">No hay productos</p>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>

<!-- Product Modal -->
<div class="modal fade" id="productModal" tabindex="-1" aria-labelledby="productModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg rounded-4 overflow-hidden">
      <div class="modal-header border-bottom border-light bg-light">
        <div class="d-flex align-items-center">
          <div class="bg-primary bg-opacity-10 text-primary rounded-circle p-2 me-2 d-flex align-items-center justify-content-center" style="width: 36px; height: 36px;">
            <i class="bi" [ngClass]="isEdit ? 'bi-pencil-fill' : 'bi-plus-lg'"></i>
          </div>
          <h5 class="modal-title fw-bold" id="productModalLabel">{{ isEdit ? 'Edit Product' : 'Add New Product' }}</h5>
        </div>
        <button type="button" class="btn-close" (click)="closeModal()" aria-label="Close"></button>
      </div>
      <div class="modal-body p-4">
        <form (ngSubmit)="save()" #productForm="ngForm">
          
          <div class="mb-3">
            <label for="name" class="form-label fw-semibold text-secondary small text-uppercase tracking-wide">Product Name</label>
            <div class="input-group">
              <span class="input-group-text bg-transparent border-end-0 border-light text-muted">
                <i class="bi bi-tag"></i>
              </span>
              <input type="text" class="form-control modern-form-control border-start-0 ps-0" id="name" name="name" [(ngModel)]="product.name" placeholder="e.g. Barbie Developer" required>
            </div>
          </div>
          
          <div class="row mb-3">
            <div class="col-6">
              <label for="price" class="form-label fw-semibold text-secondary small text-uppercase tracking-wide">Price</label>
              <div class="input-group">
                <span class="input-group-text bg-transparent border-end-0 border-light text-muted">
                  <i class="bi bi-currency-dollar"></i>
                </span>
                <input type="number" class="form-control modern-form-control border-start-0 ps-0" id="price" name="price" [(ngModel)]="product.price" placeholder="0.00" required>
              </div>
            </div>
            <div class="col-6">
              <label for="age" class="form-label fw-semibold text-secondary small text-uppercase tracking-wide">Max Age</label>
              <div class="input-group">
                <span class="input-group-text bg-transparent border-end-0 border-light text-muted">
                  <i class="bi bi-person"></i>
                </span>
                <input type="number" class="form-control modern-form-control border-start-0 ps-0" id="age" name="age" [(ngModel)]="product.ageRestriction" placeholder="12">
              </div>
            </div>
          </div>
          
          <div class="mb-3">
            <label for="company" class="form-label fw-semibold text-secondary small text-uppercase tracking-wide">Company</label>
            <div class="input-group">
              <span class="input-group-text bg-transparent border-end-0 border-light text-muted">
                <i class="bi bi-building"></i>
              </span>
              <input type="text" class="form-control modern-form-control border-start-0 ps-0" id="company" name="company" [(ngModel)]="product.company" placeholder="e.g. Mattel">
            </div>
          </div>
          
          <div class="mb-4">
            <label for="description" class="form-label fw-semibold text-secondary small text-uppercase tracking-wide">Description</label>
            <textarea class="form-control modern-form-control border-light" id="description" name="description" rows="3" [(ngModel)]="product.description" placeholder="Enter product description here..."></textarea>
          </div>
          
          <div class="d-flex justify-content-end gap-2 pt-2 border-top border-light mt-4">
            <button type="button" class="btn btn-action px-3 py-2" (click)="closeModal()">
              Cancel
            </button>
            <button type="submit" class="btn btn-gradient px-4 py-2" [disabled]="!productForm.form.valid">
              Save Changes
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
